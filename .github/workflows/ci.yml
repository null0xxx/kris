{
  "name": "ci",
  "on": [
    "push",
    "pull_request"
  ],
  "defaults": {
    "run": {
      "working-directory": "lsassist"
    }
  },
  "jobs": {
    "ruff": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/pip",
            "key": "pip-${{ hashFiles('lsassist/requirements.lock', 'lsassist/requirements-dev.lock') }}"
          }
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock"
        },
        {
          "name": "ruff",
          "run": ".venv/bin/ruff check src tests"
        }
      ]
    },
    "unit": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/pip",
            "key": "pip-${{ hashFiles('lsassist/requirements.lock', 'lsassist/requirements-dev.lock') }}"
          }
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock && .venv/bin/pip install -e . --no-deps"
        },
        {
          "name": "unit + contract tests",
          "run": ".venv/bin/pytest tests/unit tests/contract -q"
        }
      ]
    },
    "loc-count": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "TCB LOC budget (SPEC \u00a72.3)",
          "run": "scripts/loc-count"
        }
      ]
    },
    "tcb-loc": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "TCB LOC checkpoint gate (SPEC \u00a72.3: target 6000, hard stop 8000)",
          "run": "python3 scripts/loc-count --manifest scripts/tcb-loc-manifest.txt --target 6000 --hard-stop 8000"
        }
      ]
    },
    "coverage": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "no coverage pragma in the TCB (SPEC \u00a723.1, T2.13 review checkpoint)",
          "run": "set -eu\n# grep exits 2 (not 1) on a missing path, so a bare `if grep ...` would\n# pass after a package rename. Check the directories exist first.\nfor d in src/lsassist/kernel src/lsassist/policy src/lsassist/sandbox src/lsassist/audit src/lsassist/recovery src/lsassist/tools/dispatcher.py src/lsassist/tools/result.py; do\n  test -e \"$d\" || { echo \"ERROR: TCB package $d is missing - the pragma grep cannot fail open\" >&2; exit 1; }\ndone\nif grep -rniE --include='*.py' 'pragma:?[[:space:]]*no[[:space:]]*(cover|branch)' src/lsassist/kernel src/lsassist/policy src/lsassist/sandbox src/lsassist/audit src/lsassist/recovery src/lsassist/tools/dispatcher.py src/lsassist/tools/result.py; then\n  echo 'ERROR: coverage pragmas are forbidden in TCB packages (SPEC 23.1, ADR-011)' >&2\n  exit 1\nfi"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/pip",
            "key": "pip-${{ hashFiles('lsassist/requirements.lock', 'lsassist/requirements-dev.lock') }}"
          }
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock && .venv/bin/pip install -e . --no-deps"
        },
        {
          "name": "branch coverage measurement (ADR-011: coverage, not pytest-cov)",
          "run": ".venv/bin/python -m coverage run --branch --source=src/lsassist/kernel,src/lsassist/policy,src/lsassist/sandbox,src/lsassist/audit,src/lsassist/recovery -m pytest tests/unit tests/property -q"
        },
        {
          "name": "100% branch floor - blocking (SPEC \u00a723.1; fail_under lives in pyproject.toml)",
          "run": ".venv/bin/python -m coverage report --show-missing"
        }
      ]
    },
    "dispatcher-coverage": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/pip",
            "key": "pip-${{ hashFiles('lsassist/requirements.lock', 'lsassist/requirements-dev.lock') }}"
          }
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock && .venv/bin/pip install -e . --no-deps"
        },
        {
          "name": "100% branch on the TCB files inside a non-TCB package (SPEC \u00a72.3)",
          "run": ".venv/bin/python -m coverage run --branch --source=lsassist.tools.dispatcher,lsassist.tools.result -m pytest tests/unit/tools -q && .venv/bin/python -m coverage report --show-missing"
        }
      ]
    },
    "integration": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/pip",
            "key": "pip-${{ hashFiles('lsassist/requirements.lock', 'lsassist/requirements-dev.lock') }}"
          }
        },
        {
          "name": "bubblewrap (the sandbox under test; without it every case skips)",
          "run": "sudo apt-get update && sudo apt-get install -y bubblewrap"
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock && .venv/bin/pip install -e . --no-deps"
        },
        {
          "name": "sandbox boundary tests that must SPAWN (SPEC \u00a78.3, I11)",
          "run": ".venv/bin/pytest tests/integration tests/e2e -q"
        }
      ]
    },
    "t306-handler-coverage": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "bubblewrap (T3.06 real sandbox boundary)",
          "run": "sudo apt-get update && sudo apt-get install -y bubblewrap"
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock && .venv/bin/pip install -e . --no-deps"
        },
        {
          "name": "T3.06 handlers under unit + real integration coverage",
          "run": ".venv/bin/python -m coverage run --branch --source=lsassist.tools.handlers.test_run,lsassist.tools.handlers.proc_exec,lsassist.tools.handlers.net_fetch -m pytest tests/unit/tools/test_exec_net_tools.py tests/integration/tools/test_exec_net_sandbox.py -q"
        },
        {
          "name": "T3.06 handler floor - blocking",
          "run": ".venv/bin/python -m coverage report --fail-under=90 --show-missing"
        }
      ]
    }
  }
}
