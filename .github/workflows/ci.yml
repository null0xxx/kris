{
  "name": "ci",
  "on": ["push", "pull_request"],
  "jobs": {
    "ruff": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/pip",
            "key": "pip-${{ hashFiles('requirements.lock', 'requirements-dev.lock') }}"
          }
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock"
        },
        {"name": "ruff", "run": ".venv/bin/ruff check src tests"}
      ]
    },
    "unit": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/pip",
            "key": "pip-${{ hashFiles('requirements.lock', 'requirements-dev.lock') }}"
          }
        },
        {
          "name": "install (hashes enforced, ADR-005)",
          "run": "python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.lock -r requirements-dev.lock && .venv/bin/pip install -e . --no-deps"
        },
        {"name": "unit tests", "run": ".venv/bin/pytest tests/unit -q"}
      ]
    },
    "loc-count": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"name": "TCB LOC budget (SPEC §2.3)", "run": "scripts/loc-count"}
      ]
    }
  }
}
