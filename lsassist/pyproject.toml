[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsassist"
version = "0.1.0"
description = "Personal Linux AI assistant — security-first, sandboxed (SPEC Gate 4)"
requires-python = ">=3.12"
dependencies = [
    # Runtime allowlist per SPEC §13.1. Exact pins+hashes live in
    # requirements.lock; install via ADR-005 venv path, never plain pip.
    "httpx",
    "pydantic",
    "jsonschema",
    "prompt_toolkit",
    "rich",
    "secretstorage",
]

[project.scripts]
lsassist = "lsassist.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py files that must travel with the code. Without this stanza setuptools
# ships ONLY modules: a wheel built from this tree contained zero non-.py files,
# so on any non-editable install (`pip install .`, or ADR-005's documented
# `uv tool install` fast-path) `tools/registry.py` could not find its §6.2
# schema and `load_registry()` raised on every call — kernel startup permanently
# BLOCKED. The editable install ADR-005 prescribes as PRIMARY hid this, because
# an editable install resolves back to the source tree.
#
# `manifests/*.json` is listed for the same reason and is NOT redundant: that
# directory has no `__init__.py`, so `packages.find` never sees it as a package
# and a bare `*.json` glob does not recurse into it. T3.04 populates it.
[tool.setuptools.package-data]
"lsassist.tools" = ["*.json", "manifests/*.json"]
"lsassist.memory" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: real sandbox or local-network boundary"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

# mypy --strict applies ONLY to TCB modules (SPEC §2.3 / §23.1):
# kernel, policy, sandbox, audit, recovery, config, contracts — plus the TWO
# TCB files inside an otherwise non-TCB package, `tools.dispatcher` and
# `tools.result` (§2.3's "tools/ dispatcher core (without individual
# handlers)"). They are named individually rather than as `lsassist.tools.*` on
# purpose: the handlers and the registry around them are non-TCB, and widening
# the pattern would quietly
# promise a strictness the §2.3 boundary does not claim.
[[tool.mypy.overrides]]
module = [
    "lsassist.tools.dispatcher",
    "lsassist.tools.result",
    "lsassist.kernel.*",
    "lsassist.policy.*",
    "lsassist.sandbox.*",
    "lsassist.audit.*",
    "lsassist.recovery.*",
    "lsassist.config.*",
    "lsassist.contracts.*",
]
strict = true

# ---------------------------------------------------------------------------
# Branch-coverage gate — SPEC §23.1 floor, ADR-011 tooling (T2.13).
#
# Invoked as `coverage`, never `pytest-cov` (ADR-011 rejected the plugin):
#     coverage run --branch --source=<the three packages below> -m pytest ...
#     coverage report --show-missing
#
# ADR-011's "Named limitation" governs how to read a green result: coverage
# measures EXECUTION, not ASSERTION. This config's only job is to make sure the
# number cannot be reached by weakening the measurement. Every knob below that
# could forgive an unexecuted line or an untaken arc is pinned, because each one
# is a way to report 100% while §23.1's invariant is violated. The gate's own
# tests live in tests/unit/scripts/test_coverage_gate.py.
[tool.coverage.run]
branch = true
# Scope = SPEC §23.1's TCB packages. `audit` joined at T4.01 (the single §14.3
# redactor engine, I8); `recovery` JOINED at T4.04 — a rollback trusts the
# checkpoint store when the workspace has already been mutated, so a hole
# there surfaces only at the worst possible moment. `source` (not `include`) is
# deliberate: `source` drags never-imported modules into the report at 0%, so
# dead untested code turns the gate red instead of vanishing from it.
source = [
    "src/lsassist/kernel",
    "src/lsassist/policy",
    "src/lsassist/sandbox",
    "src/lsassist/audit",
    "src/lsassist/recovery",
]
# No `omit`: every omit pattern is a hole in the floor.

[tool.coverage.report]
# Exactly 100 — `coverage.results.should_fail_under` special-cases this value so
# the total must really be 100.0; at 99.9 rounding would buy a pass.
fail_under = 100
show_missing = true
precision = 0
ignore_errors = false

# `exclude_lines` REPLACES coverage's defaults, which in 7.x are three patterns:
# `# pragma: no cover`, a `...` stub body, and `if TYPE_CHECKING:`. Two of those
# are dropped here on purpose:
#   * `pragma: no cover` is forbidden in TCB packages by §23.1, so honouring it
#     in the config would make the config itself the loophole. The CI job also
#     greps for it, belt and braces.
#   * `if TYPE_CHECKING:` has a genuinely untaken arc at runtime; §23.1 wants
#     that visible rather than silently forgiven.
# What remains is the `...` stub body of a `typing.Protocol` / `@overload`
# declaration (14 of them in kernel/machine.py and policy/recheck.py). `...` is
# a no-op by language semantics, so this exclusion cannot hide behaviour — the
# alternative would be tests that call Protocol stubs purely to paint the number
# green, which is exactly the theatre ADR-011 warns against.
exclude_lines = ['^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)']
# `exclude_also`/`partial_also` are APPEND vectors — coverage merges them into
# the lists above in CoverageConfig.post_process. Empty, and asserted empty.
exclude_also = []
partial_also = []

# `partial_branches` = [] removes the `# pragma: no branch` escape.
#
# DO NOT also write `partial_branches_always = []`. coverage's
# `PythonFileReporter.no_branch_lines()` joins BOTH lists with `join_regex` and
# passes the result to `lines_matching` with no empty-string guard, and
# `join_regex([])` is `""`, which `re.finditer` matches at every position. With
# both lists empty, every line in every file lands in `no_branch`, every missing
# branch arc is discarded, and the gate reports 100% branch on a suite with no
# branch tests at all. So the two default patterns are pinned here explicitly:
# they only ever match a literally-constant condition, whose "missing" arc is
# unreachable by language semantics, and their presence keeps the joined regex
# non-empty. (`exclude_lines` is safe from the same footgun only because
# PythonParser._raw_parse guards it with `if self.exclude:`.)
partial_branches = []
partial_branches_always = ['while (True|1|False|0):', 'if (True|1|False|0):']

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
